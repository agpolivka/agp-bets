services:
  postgres:
    image: postgres:16-alpine
    container_name: agp-bets-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: agp_bets
      POSTGRES_USER: agp_bets
      POSTGRES_PASSWORD: agp_bets
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agp_bets -d agp_bets"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
