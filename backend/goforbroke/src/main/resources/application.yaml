spring:
  application:
    name: goforbroke
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agp_bets}
    username: ${SPRING_DATASOURCE_USERNAME:agp_bets}
    password: ${SPRING_DATASOURCE_PASSWORD:agp_bets}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  ssl:
    enabled: false
    certificate: ""
    key-store: ""

agp:
  team-refresh:
    schedule:
      enabled: ${AGP_TEAM_REFRESH_SCHEDULE_ENABLED:false}
      cron: ${AGP_TEAM_REFRESH_SCHEDULE_CRON:0 0 */6 * * *}
  etl:
    r-executable: ${AGP_RSCRIPT_PATH:Rscript}
    scripts-dir: ${AGP_ETL_SCRIPTS_DIR:../../etl/r}
    max-concurrent-scripts: ${AGP_ETL_MAX_CONCURRENT_SCRIPTS:1}
  player-history-backfill:
    enabled: ${AGP_PLAYER_HISTORY_BACKFILL_ENABLED:true}
  stats-refresh:
    enabled: ${AGP_STATS_REFRESH_ENABLED:true}
    poll-interval-ms: ${AGP_STATS_REFRESH_POLL_INTERVAL_MS:14400000}
  odds-api-io:
    base-url: ${ODDS_API_IO_BASE_URL:https://api.odds-api.io/v3}
    api-key: ${ODDS_API_IO_KEY:}
  odds-backfill:
    enabled: ${AGP_ODDS_BACKFILL_ENABLED:false}
    league: ${AGP_ODDS_BACKFILL_LEAGUE:usa-nfl}
    from: ${AGP_ODDS_BACKFILL_FROM:2025-12-14T00:00:00Z}
    to: ${AGP_ODDS_BACKFILL_TO:2026-02-09T00:00:00Z}
    bookmakers: ${AGP_ODDS_BACKFILL_BOOKMAKERS:Bet365}
    request-delay-ms: ${AGP_ODDS_BACKFILL_DELAY_MS:1500}
  player-catalog-refresh:
    enabled: ${AGP_PLAYER_CATALOG_REFRESH_ENABLED:true}
    poll-interval-ms: ${AGP_PLAYER_CATALOG_REFRESH_POLL_INTERVAL_MS:14400000}
    stale-after-hours: ${AGP_PLAYER_CATALOG_REFRESH_STALE_AFTER_HOURS:24}
